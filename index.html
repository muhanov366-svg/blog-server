<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой блог</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="nav-brand">Мой Блог</a>
            <div class="nav-links">
                <a href="#posts" class="nav-link">Посты</a>
                <a href="#about" class="nav-link">О блоге</a>
            </div>
            <div class="auth-buttons">
                <button id="createPostBtn" class="btn btn-success" style="display: none;">+ Новый пост</button>
                <button id="loginBtn" class="btn btn-primary">Войти</button>
                <button id="registerBtn" class="btn btn-secondary">Регистрация</button>
                <button id="logoutBtn" class="btn btn-danger" style="display: none;">Выйти</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Модальное окно входа -->
        <div id="loginModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Вход в аккаунт</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Пароль</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Войти</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно регистрации -->
        <div id="registerModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Регистрация</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">Имя</label>
                        <input type="text" id="registerName" required>
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Пароль</label>
                        <input type="password" id="registerPassword" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
                </form>
            </div>
        </div>

        <!-- Модальное окно создания поста -->
        <div id="createPostModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Создать новый пост</h2>
                <form id="createPostForm">
                    <div class="form-group">
                        <label for="postTitle">Заголовок</label>
                        <input type="text" id="postTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="postContent">Содержание</label>
                        <textarea id="postContent" rows="5" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="postTags">Теги (через запятую)</label>
                        <input type="text" id="postTags" placeholder="например: туториал, блог, советы">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="postPrivate"> Скрытый пост (только по запросу)
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">Опубликовать</button>
                </form>
            </div>
        </div>

        <!-- Основной контент -->
        <header class="hero">
            <h1>Добро пожаловать в наш блог!</h1>
            <p id="welcomeMessage">Пожалуйста, войдите, чтобы увидеть посты</p>
        </header>

        <section id="posts" class="posts-section">
            <div class="posts-header">
                <h2>Последние посты</h2>
                <div class="search-container">
                    <input type="text" id="searchTags" placeholder="Поиск по тегам..." class="search-input">
                </div>
            </div>
            <div id="postsContainer" class="posts-grid">
                <!-- Посты будут загружены здесь -->
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
